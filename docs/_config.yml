# GitHub Pages (Jekyll) settings for the site built from /docs.
# index.html is a plain page; the Markdown guides render with _layouts/default.html,
# in the ConstructCraft Network look (assets/css/network.css).
title: ConstructCraft
description: Free and open source BIM software, written in Rust.
defaults:
  - scope:
      path: ""
    values:
      layout: default
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-sitemap
  - jekyll-seo-tag
relative_links:
  enabled: true
url: https://constructcraft.net
baseurl: ""
